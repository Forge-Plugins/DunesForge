name: Bug report
description: Something does not work as the documentation describes.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Two things help most: the **version**
        shown at the top of the DunesForge panel (press **N** in the 3D
        viewport, **DunesForge** tab), and the **log file** - click
        **Open Log Folder** in the main panel and attach `tydunes.log` below.
        The [Troubleshooting guide](https://github.com/Forge-Plugins/DunesForge/blob/main/docs/DunesForge_Troubleshooting.pdf)
        may already have the answer.
  - type: input
    id: df_version
    attributes:
      label: DunesForge version
      description: shown at the top of the panel, for example "DunesForge build 0.85.0 beta"
      placeholder: "0.85.0"
    validations:
      required: true
  - type: input
    id: blender_version
    attributes:
      label: Blender version
      placeholder: "5.3 (or 4.2, 4.5 ...)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and graphics card
      description: and whether the panel says "GPU Acceleration ACTIVE" or "UNAVAILABLE"
      placeholder: "Windows 11, NVIDIA RTX 4070, GPU Acceleration ACTIVE"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Opened the demo "Desert" (or: my own terrain, 512 x 512)
        2. Clicked Initialize Simulation, then pressed Play
        3. Expected the dunes to move, but ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Installation or update
        - GPU backend (CuPy)
        - Sand, dunes, snow or wind
        - Water, rain or moisture
        - A demo scene
        - Look, material or render
        - Export or bake
        - Interface and panels
        - Documentation
        - Something else
    validations:
      required: true
  - type: dropdown
    id: repeat
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Log file, screenshots, scene
      description: Drag tydunes.log and screenshots here. If you can, attach a small .blend that shows the problem (zip it first).
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this one is not there yet.
          required: true
        - label: This report contains no licence key or purchase details.
          required: true
