name: Feature request
description: An idea for a new control, demo scene, workflow or improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do?
      description: Describe the task, not only the solution - "I want sand to pile up behind a moving vehicle" says more than "add a button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: proposal
    attributes:
      label: How could DunesForge help?
      description: A control, a demo scene, a workflow... any idea is welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sand and dunes
        - Snow
        - Water and rain
        - Wind and obstacles
        - Look, material or render
        - Demo scenes
        - Export or bake
        - Interface
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this idea is not there yet.
          required: true
