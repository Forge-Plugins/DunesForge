name: Feature request
description: An idea for a new dial, command, option or improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do?
      description: Describe the task, not only the solution - "I switch between these three modifiers all the time" says more than "add a button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: proposal
    attributes:
      label: How could DunesForge help?
      description: A dial, a direction, an option, a gesture... any idea is welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Built-in dials
        - Gestures and the dial itself
        - The hotbox
        - The menu editor
        - Shortcuts / mouse buttons
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this idea is not there yet.
          required: true
